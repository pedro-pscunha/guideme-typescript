name: Spec drift

# spec/ is vendored from guideme-rust and is the cross-SDK contract. A change lands there,
# not here, so nothing in this repository moves when it does. CI checks it on every pull
# request; this catches it between them.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-drift-weekly:
    name: spec-drift (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: mise run spec-check
        run: mise run spec-check
