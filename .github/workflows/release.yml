name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # The tag names the version that reaches npm, so a tag that disagrees with package.json
      # stops here rather than publishing a number nobody meant. Checked before the gate,
      # which is the slow part. A dispatched run has a branch in GITHUB_REF_NAME and nothing
      # to publish, so there is nothing for it to check.
      - name: the tag matches the package version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          echo "tag ${tag}; package.json ${pkg}"
          [ "${tag}" = "${pkg}" ] || { echo "::error::tag ${tag} != package.json ${pkg}"; exit 1; }

      - name: bun install --frozen-lockfile
        run: bun install --frozen-lockfile

      # The whole gate again, on the exact commit the tag points at. CI green on main proves
      # the branch, not the tag, and a published version is permanent.
      - name: mise run check
        run: mise run check

      # The gate already packed once. Packing again from an explicit step keeps what is
      # uploaded from depending on what the gate happens to leave behind.
      - name: bun pm pack
        run: |
          set -euo pipefail
          mkdir -p artifact
          bun pm pack --destination artifact

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: artifact/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing exchanges this for a short-lived registry token, so no npm
      # credential exists in this repository's secrets and none should ever be added.
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: artifact/
      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm is older on some
      # images, and an old npm fails with an OIDC error that names nothing useful.
      - name: pin npm
        run: npm install -g npm@12.0.2
      - name: npm publish --provenance
        run: npm publish artifact/*.tgz --provenance --access public
