name: Latest deps

# NOT a required check, and its job name is none of the seven the ruleset requires. The gate
# builds bun.lock, but a consumer resolves `zod@^4.6.5` and the `@opentelemetry/api@^1.9.0`
# peer to the newest release in range. This installs those newest versions over the lock and
# runs the suite, on every pull request, on main, and weekly, so a new release that breaks the
# package shows up here before a user reports it, even in a week with no commits.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  latest-deps:
    name: latest-deps (unpinned)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: bun install --frozen-lockfile
        run: bun install --frozen-lockfile
      - name: mise run latest-deps
        run: mise run latest-deps
