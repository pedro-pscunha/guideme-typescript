name: Advisories

# Re-check the advisory database against an unchanged lock file. A dependency that was clean
# when it was pinned can stop being clean without anything here changing.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: bun install --frozen-lockfile
        run: bun install --frozen-lockfile
      - name: mise run audit
        run: mise run audit
