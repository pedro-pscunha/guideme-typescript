name: Advisories

# Re-check the advisory database against an unchanged lock file. A dependency that was clean
# when it was pinned can stop being clean without anything here changing.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: bun install --frozen-lockfile
        run: bun install --frozen-lockfile
      - name: mise run audit
        run: mise run audit
