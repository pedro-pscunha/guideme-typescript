# The workflows pin every action to a commit SHA, which is immutable on purpose. This is one
# of the two things that move those pins forward; the other is the npm ecosystem below.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /examples/otlp
    schedule:
      interval: weekly
